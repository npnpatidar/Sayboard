apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'com.mikepenz.aboutlibraries.plugin.android'


android {
    compileSdkVersion = "android-37.1"
    defaultConfig {
        applicationId "com.elishaazaria.sayboard"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 402014
        versionName "v4.2.1"
        ndkVersion "r25c"
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
            // pass -PbuildUniversalApk=false to skip the universal APK (CI builds one ABI only)
            universalApk (project.findProperty('buildUniversalApk')?.toBoolean() ?: true)
        }
    }

    // CI: -PabiFilter=arm64-v8a produces a single per-ABI APK with no universal
    def abiFilter = project.findProperty('abiFilter')
    if (abiFilter != null) {
        splits.abi.reset()
        splits.abi.include abiFilter
        splits.abi.universalApk = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    // Newer Compose/Material libraries ship JVM 11 bytecode; kotlinc must
    // target 11 to inline them (default 1.8 no longer suffices)
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
        }
    }
    buildFeatures {
        compose true
        // IME.kt reads BuildConfig.DEBUG; AGP no longer enables this by default
        buildConfig true
    }

    namespace 'com.elishaazaria.sayboard'

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    lint {
        lintConfig = file("lint.xml")
    }
}

//ext.abiCodes = ['armeabi-v7a':1, x86:2, x86_64:3]
ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86": 3, "x86_64": 4]

// For each APK output variant, name the APK per ABI and override versionCode
// with a combination of ext.abiCodes + variant.versionCode, so per-ABI APKs
// sort above the universal APK. Uses the new Variant API (AGP 9 removed the
// old applicationVariants API).
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            def abiName = "Universal"
            output.filters.each { filter ->
                if (filter.filterType.toString() == "ABI") {
                    abiName = filter.identifier
                }
            }
            output.outputFileName.set("Sayboard_${abiName}.apk")

            // Because abiCodes.get() returns null for ABIs that are not mapped
            // by ext.abiCodes, the version code is only overridden for
            // per-ABI APKs. However, because you want universal APKs to have
            // the lowest version code, this outcome is desirable.
            def variantVersionCode = project.ext.abiCodes.get(abiName)
            if (variantVersionCode != null) {
                output.versionCode.set(output.versionCode.get() + variantVersionCode)
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'net.java.dev.jna:jna:5.17.0@aar'
    implementation 'com.alphacephei:vosk-android:0.3.32'
    // sherpa-onnx: offline Whisper + Parakeet (NeMo TDT) inference.
    // Official release AAR (with jniLibs) republished via JitPack.
    // NOTE: use the submodule coordinate; com.github.k2-fsa:sherpa-onnx
    // pulls desktop/jar duplicates that break dexing.
    // Supply chain: JitPack builds are unsigned; artifact hashes are pinned
    // in gradle/sherpa-onnx.PROVENANCE and verified in CI. Do not bump the
    // version without updating that file.
    implementation 'com.github.k2-fsa.sherpa-onnx:sherpa-onnx:1.13.8'
    // tar.bz2 model archives (sherpa-onnx releases ship .tar.bz2)
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    // Directory-tree import (DocumentFile) for extracted model folders
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.google.android.material:material:1.14.0'


    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.0'
//    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
//    implementation 'androidx.lifecycle:lifecycle-extensions:2.6.2'
//    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
//    implementation 'androidx.navigation:navigation-fragment:2.7.4'
//    implementation 'androidx.navigation:navigation-ui:2.7.4'
//    implementation 'androidx.preference:preference:1.2.1'

    implementation 'org.greenrobot:eventbus:3.3.1'


    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0"

    implementation 'dev.patrickgold.jetpref:jetpref-datastore-model:0.1.0-beta14'
    implementation 'dev.patrickgold.jetpref:jetpref-datastore-ui:0.1.0-beta14'
    implementation 'dev.patrickgold.jetpref:jetpref-material-ui:0.1.0-beta14'

    def composeBom = platform('androidx.compose:compose-bom:2026.08.00')
    implementation composeBom
    androidTestImplementation composeBom

    // Choose one of the following:
    // Material Design 3
//    implementation 'androidx.compose.material3:material3'
    // or Material Design 2
    implementation 'androidx.compose.material:material'
    // or skip Material Design and build directly on top of foundational components
//    implementation 'androidx.compose.foundation:foundation'
    // or only import the main APIs for the underlying toolkit systems,
    // such as input and measurement/layout
//    implementation 'androidx.compose.ui:ui'

    // Android Studio Preview support
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // UI Tests
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Optional - Included automatically by material, only add when you need
    // the icons but not the material library (e.g. when using Material3 or a
    // custom design system based on Foundation)
//    implementation 'androidx.compose.material:material-icons-core'
    // Optional - Add full set of material icons
    implementation 'androidx.compose.material:material-icons-extended'
    // Optional - Add window size utils
    implementation 'androidx.compose.material3:material3-window-size-class'

    // Optional - Integration with activities
    implementation 'androidx.activity:activity-compose:1.10.1'
    // Optional - Integration with ViewModels
//    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'
    // Optional - Integration with LiveData
    implementation 'androidx.compose.runtime:runtime-livedata'
    // Optional - Integration with RxJava
//    implementation 'androidx.compose.runtime:runtime-rxjava2'

    implementation "com.mikepenz:aboutlibraries-compose:14.1.0"
}

name: Build APK

on:
  push:
    branches: [ master, modernui ]
  pull_request:
    branches: [ master, modernui ]
  workflow_dispatch:
    inputs:
      gen-metadata:
        description: "Generate gradle/verification-metadata.xml instead of building (uploads it as an artifact for human review)"
        required: false
        default: false
        type: boolean
      full-check:
        description: "Also run lint + release smoke (always on for pull requests; off on push for fast bug-fix iteration)"
        required: false
        default: false
        type: boolean

# Fast iteration: a new push kills the stale run instead of queueing.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# B24: least-privilege default for all jobs (no provenance attestation
# added, so no id-token: write needed).
permissions:
  contents: read

jobs:
  build:
    # B24: pinned runner (was ubuntu-latest).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # B24: SHA-pinned (was actions/checkout@v4); Dependabot tracks the
        # version comment for updates.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        # B24: SHA-pinned (was actions/setup-java@v4); Dependabot tracks the
        # version comment for updates.
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        # B24: SHA-pinned (was gradle/actions/setup-gradle@v3); Dependabot
        # tracks the version comment for updates.
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      # B12/B23 + B25+B26: supply-chain gate — MUST run BEFORE any gradle
      # build step. Downloads the exact AARs consumed by the build
      # (sherpa-onnx 1.13.8 via JitPack, vosk-android 0.3.32 + jna 5.17.0
      # via Maven Central; versions in app/build.gradle) and checks them
      # against gradle/sherpa-onnx.PROVENANCE with `sha256sum -c`.
      # `curl -f` fails the step on HTTP errors, a `sha256sum -c`
      # mismatch fails the job, and the line-count guard fails closed if
      # a PROVENANCE entry is missing — so a poisoned artifact never
      # reaches the compiler.
      - name: Verify pinned artifacts
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSL --retry 3 --max-time 300 "https://jitpack.io/com/github/k2-fsa/sherpa-onnx/sherpa-onnx/1.13.8/sherpa-onnx-1.13.8.aar" -o sherpa-onnx-1.13.8.aar
          curl -fsSL --retry 3 --max-time 300 "https://repo1.maven.org/maven2/com/alphacephei/vosk-android/0.3.32/vosk-android-0.3.32.aar" -o vosk-android-0.3.32.aar
          curl -fsSL --retry 3 --max-time 300 "https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.17.0/jna-5.17.0.aar" -o jna-5.17.0.aar
          test "$(grep -cE "^[0-9a-f]{64}  (sherpa-onnx-|vosk-android-|jna-)" "$GITHUB_WORKSPACE/gradle/sherpa-onnx.PROVENANCE")" -eq 3
          grep -E "^[0-9a-f]{64}  (sherpa-onnx-|vosk-android-|jna-)" "$GITHUB_WORKSPACE/gradle/sherpa-onnx.PROVENANCE" | sha256sum -c -

      - name: Install Android SDK 37.1
        run: |
          set -euo pipefail
          # B28: fail fast when the runner image lacks an SDK instead of
          # blindly accepting licenses.
          : "${ANDROID_HOME:?ANDROID_HOME must be set by the runner image}"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Versions synced with app/build.gradle (compileSdk android-37.1)
          # and shell.nix (build-tools 37.0.0).
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.1" "build-tools;37.0.0"

      # B27+B29: lint config path fixed in app/build.gradle (file("lint.xml")).
      # F8(a): lint + release smoke run on EVERY push (unconditional).
      # Rationale: plain pushes landed lint/R8 breakage of exactly the §13
      # class when these were PR/full-check-only; cancel-in-progress bounds
      # the wasted compute on superseded pushes. The supply-chain floor
      # (Verify pinned artifacts) stays unconditional regardless.
      - name: Lint
        if: ${{ !inputs.gen-metadata }}
        run: ./gradlew lint --stacktrace

      # verification-metadata groundwork (§13.3): hashes only, no key export.
      # Manual dispatch only; a human reviews the artifact and commits it.
      - name: Generate verification metadata
        if: ${{ inputs.gen-metadata }}
        run: ./gradlew --write-verification-metadata sha256 assembleDebug -PabiFilter=arm64-v8a --stacktrace

      - name: Upload verification metadata
        if: ${{ inputs.gen-metadata }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 14

      - name: Build arm64-v8a debug APK
        if: ${{ !inputs.gen-metadata }}
        run: ./gradlew assembleDebug -PabiFilter=arm64-v8a --stacktrace

      # B16+B27: release smoke test (build only, no signing) so the
      # R8/minify path is exercised even though CI ships the debug APK.
      # F8(a): unconditional (see Lint note above).
      - name: Smoke-build release (unsigned)
        if: ${{ !inputs.gen-metadata }}
        run: ./gradlew assembleRelease -PabiFilter=arm64-v8a --stacktrace

      - name: Upload APK
        if: ${{ !inputs.gen-metadata }}
        # B24: SHA-pinned (was actions/upload-artifact@v4); Dependabot
        # tracks the version comment for updates.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sayboard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          # B27: bound storage lifetime for debug binaries.
          retention-days: 14

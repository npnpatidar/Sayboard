android.enableJetifier=true
# nonFinalResIds=true is the AGP default and is required for R8 optimized
# resource shrinking (release builds fail otherwise). Verified: no `when` or
# annotation usage of R constants in the codebase, so non-final IDs are safe.
# Jetifier stays on: legacy JNA/Vosk AARs predate AndroidX.
android.nonFinalResIds=true
android.nonTransitiveRClass=false
android.useAndroidX=true
org.gradle.jvmargs=-Xmx1536M
